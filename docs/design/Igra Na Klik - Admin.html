document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8px rgba(0,0,0,.3))\">\n      <div style=\"line-height:1.05\">\n        <div style=\"font-family:'Fredoka';font-weight:700;font-size:1.12rem;letter-spacing:.01em\">Igra Na Klik<\u002Fdiv>\n        <div style=\"font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:#C29B47;font-weight:700;margin-top:2px\">Admin<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"side-block\" style=\"font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,235,224,.5);font-weight:700;padding:.3rem .5rem .1rem\">Igre<\u002Fdiv>\n    <nav class=\"app-nav\" style=\"display:flex;flex-direction:column;gap:.15rem\">\n      <sc-for list=\"{{ games }}\" as=\"g\" hint-placeholder-count=\"7\">\n        <a href=\"#\" sc-camel-on-click=\"{{ g.onClick }}\" title=\"{{ g.label }}\" style=\"display:flex;align-items:center;gap:.6rem;text-decoration:none;color:{{ g.fg }};background:{{ g.bg }};border-radius:11px;padding:.55rem .6rem;font-weight:700;font-size:.9rem;position:relative;transition:background .15s\">\n          <span style=\"width:4px;height:20px;border-radius:3px;background:{{ g.bar }};flex:none\"><\u002Fspan>\n          <span style=\"font-size:1.05rem;width:1.4rem;text-align:center;flex:none\">{{ g.icon }}<\u002Fspan>\n          <span class=\"nlabel\" style=\"flex:1;white-space:nowrap\">{{ g.label }}<\u002Fspan>\n          <span class=\"nlabel\" style=\"font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:20px;background:{{ g.pillBg }};color:{{ g.pillFg }}\">{{ g.count }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div class=\"side-block\" style=\"flex:1\"><\u002Fdiv>\n    <div class=\"side-block\" style=\"border-top:1px solid rgba(245,235,224,.14);padding-top:.8rem;margin-top:.4rem\">\n      <div style=\"display:flex;align-items:center;gap:.55rem;padding:.4rem .5rem;border-radius:11px;background:rgba(62,125,87,.22)\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#8FD3A8;box-shadow:0 0 0 3px rgba(143,211,168,.25);flex:none\"><\u002Fspan>\n        <div style=\"flex:1;line-height:1.15\">\n          <div style=\"font-size:.78rem;font-weight:800\">Otključano<\u002Fdiv>\n          <div style=\"font-size:.66rem;color:rgba(245,235,224,.6)\">Admin token aktivan<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:.72rem;font-weight:700;color:rgba(245,235,224,.75)\">Izađi<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <main class=\"app-main\" style=\"padding:1.6rem 2rem 5rem;min-width:0;overflow-x:hidden\">\n    <div style=\"font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#A07D2E;font-weight:800;margin-bottom:.3rem\">{{ gameLabel }}<\u002Fdiv>\n\n    <!-- ===== PACK PICKER BAR ===== -->\n    <sc-if value=\"{{ hasPicker }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem\">\n        <div style=\"position:relative\">\n          <button sc-camel-on-click=\"{{ togglePicker }}\" style=\"font:inherit;cursor:pointer;display:flex;align-items:center;gap:.7rem;background:#FAF6F0;border:1.5px solid rgba(29,53,87,.2);border-radius:14px;padding:.55rem .9rem;min-width:300px;text-align:left;box-shadow:0 2px 10px rgba(29,53,87,.05)\">\n            <span style=\"font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;background:#EDE3D7;border-radius:11px;flex:none\">{{ curPack.icon }}<\u002Fspan>\n            <span style=\"flex:1;min-width:0\">\n              <span style=\"display:block;font-weight:800;font-size:1.05rem;color:#1D3557;line-height:1.15\">{{ curPack.name }}<\u002Fspan>\n              <span style=\"display:block;font-size:.78rem;color:#6E6A5E\">{{ curPack.meta }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-size:.85rem;color:#9B9488;flex:none\">▾<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ togglePicker }}\" style=\"position:fixed;inset:0;z-index:30\"><\u002Fdiv>\n            <div style=\"position:absolute;top:calc(100% + 6px);left:0;z-index:31;min-width:340px;background:#FFFCF7;border:1px solid rgba(29,53,87,.16);border-radius:14px;box-shadow:0 20px 48px rgba(20,40,63,.22);padding:.4rem;animation:menuIn .14s ease\">\n              <sc-for list=\"{{ packOptions }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ p.onSelect }}\" style=\"font:inherit;cursor:pointer;width:100%;display:flex;align-items:center;gap:.6rem;background:{{ p.rowBg }};border:none;border-radius:10px;padding:.55rem .6rem;text-align:left\">\n                  <span style=\"font-size:1.15rem;width:32px;text-align:center;flex:none\">{{ p.icon }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0\"><span style=\"display:block;font-weight:700;color:#1D3557\">{{ p.name }}<\u002Fspan><span style=\"display:block;font-size:.75rem;color:#6E6A5E\">{{ p.meta }}<\u002Fspan><\u002Fspan>\n                  <span style=\"width:8px;height:8px;border-radius:50%;background:{{ p.dot }};flex:none\"><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"border-top:1px solid rgba(29,53,87,.1);margin:.35rem 0\"><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ noop }}\" style=\"font:inherit;cursor:pointer;width:100%;display:flex;align-items:center;gap:.5rem;background:transparent;border:none;border-radius:10px;padding:.55rem .6rem;color:#1D3557;font-weight:800\">＋ Novi pack<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <span style=\"display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:800;padding:4px 11px;border-radius:20px;background:{{ curPack.badgeBg }};color:{{ curPack.badgeFg }}\">● {{ curPack.badge }}<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <button sc-camel-on-click=\"{{ noop }}\" style=\"font:inherit;cursor:pointer;border:1.5px solid rgba(29,53,87,.26);background:transparent;color:#1D3557;font-weight:700;font-size:.85rem;padding:.5rem .85rem;border-radius:11px\">⚙ Podaci<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ noop }}\" style=\"font:inherit;cursor:pointer;border:1.5px solid rgba(176,74,66,.35);background:rgba(176,74,66,.08);color:#B04A42;font-weight:700;font-size:.85rem;padding:.5rem .85rem;border-radius:11px\">🗑 Obriši pack<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== TABLE EDITOR (kviz + ko-sam-ja) ===== -->\n    <sc-if value=\"{{ showTable }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation:fadeIn .2s ease\">\n        <div style=\"display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem\">\n          <div style=\"position:relative;flex:1;min-width:180px;max-width:300px\">\n            <span style=\"position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:#9B9488\">🔎<\u002Fspan>\n            <input value=\"{{ search }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Pretraži pitanja…\" style=\"font:inherit;width:100%;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.2);border-radius:11px;padding:.5rem .7rem .5rem 2rem;font-size:.9rem\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\">\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:.3rem;flex-wrap:wrap;flex:1\">\n            <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;border:1.5px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};font-weight:700;font-size:.82rem;padding:.38rem .7rem;border-radius:20px;white-space:nowrap\">{{ f.label }} <span style=\"opacity:.7;font-weight:800\">{{ f.count }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openNew }}\" style=\"font:inherit;cursor:pointer;border:none;background:linear-gradient(120deg,#1D3557,#162E4E);color:#F5EBE0;font-weight:700;font-size:.9rem;padding:.55rem 1.1rem;border-radius:12px;box-shadow:0 8px 20px rgba(29,53,87,.24);white-space:nowrap\">＋ Novo pitanje<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#FAF6F0;border:1px solid rgba(29,53,87,.12);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(29,53,87,.05)\">\n          <div style=\"display:grid;grid-template-columns:38px 52px 1fr auto;gap:.6rem;align-items:center;padding:.6rem 1rem;background:#EDE3D7;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#6E6A5E\">\n            <span><\u002Fspan><span>Tip<\u002Fspan><span>Pitanje<\u002Fspan><span style=\"text-align:right\">Radnje<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ rows }}\" as=\"q\" hint-placeholder-count=\"6\">\n            <div draggable=\"true\" sc-camel-on-drag-start=\"{{ q.onDragStart }}\" sc-camel-on-drag-over=\"{{ dragOver }}\" sc-camel-on-drop=\"{{ q.onDrop }}\" style=\"display:grid;grid-template-columns:38px 52px 1fr auto;gap:.6rem;align-items:center;padding:{{ rowPad }} 1rem;border-top:1px solid rgba(29,53,87,.08);background:#FAF6F0\" style-hover=\"background:#FFFCF7\">\n              <span title=\"Prevuci za redosled\" style=\"cursor:grab;color:#C7BDB0;font-size:1.15rem;text-align:center;user-select:none;line-height:1\">⠿<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px\">\n                <span style=\"font-size:1.15rem;line-height:1\">{{ q.tIcon }}<\u002Fspan>\n                <span style=\"font-size:.58rem;font-weight:800;color:{{ q.tColor }};text-transform:uppercase;letter-spacing:.03em;text-align:center\">{{ q.tLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:.5rem\">\n                  <span style=\"font-size:.72rem;font-weight:800;color:#9B9488;flex:none\">{{ q.num }}<\u002Fspan>\n                  <span style=\"font-weight:700;font-size:.95rem;color:#1D3557;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ q.text }}<\u002Fspan>\n                  <sc-if value=\"{{ q.hasMedia }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:.62rem;font-weight:800;color:{{ q.tColor }};background:{{ q.tBg }};padding:1px 6px;border-radius:6px;flex:none\">{{ q.mediaTag }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"color:#6E6A5E;font-size:.82rem;margin-top:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ q.answerLine }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:.4rem\">\n                <span style=\"font-size:.72rem;font-weight:800;color:#6E6A5E;background:#EDE3D7;padding:3px 8px;border-radius:8px;white-space:nowrap\">⏱ {{ q.timeLabel }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ q.onDup }}\" title=\"Dupliraj\" style=\"font:inherit;cursor:pointer;border:1px solid rgba(29,53,87,.18);background:#FFFCF7;width:32px;height:32px;border-radius:9px;font-size:.85rem;color:#6E6A5E\">⧉<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ q.onEdit }}\" title=\"Izmeni\" style=\"font:inherit;cursor:pointer;border:1px solid rgba(29,53,87,.18);background:#FFFCF7;width:32px;height:32px;border-radius:9px;font-size:.85rem;color:#1D3557\">✎<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ q.onDel }}\" title=\"Obriši\" style=\"font:inherit;cursor:pointer;border:1px solid rgba(176,74,66,.35);background:rgba(176,74,66,.08);width:32px;height:32px;border-radius:9px;font-size:.85rem;color:#B04A42\">🗑<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:2.4rem 1rem;text-align:center;color:#9B9488;font-size:.9rem\">Nema pitanja koja odgovaraju filteru.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openNew }}\" style=\"font:inherit;cursor:pointer;width:100%;margin-top:.7rem;border:1.5px dashed rgba(29,53,87,.28);background:transparent;color:#1D3557;font-weight:700;font-size:.9rem;padding:.75rem;border-radius:13px\" style-hover=\"background:#FAF6F0;border-color:#C29B47\">＋ Dodaj pitanje<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== TAJNI AGENTI (words) ===== -->\n    <sc-if value=\"{{ showTajni }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .2s ease;max-width:820px\">\n        <p style=\"color:#6E6A5E;font-size:.9rem;margin-bottom:1rem\">Jedna reč je tajni pojam za rundu. Duplikati se automatski uklanjaju · min 25 reči da bi pack bio vidljiv.<\u002Fp>\n        <div style=\"background:#FAF6F0;border:1px solid rgba(29,53,87,.12);border-radius:16px;padding:1rem\">\n          <div style=\"display:flex;gap:.5rem;margin-bottom:.9rem\">\n            <input value=\"{{ tajniInput }}\" sc-camel-on-input=\"{{ onTajniInput }}\" sc-camel-on-key-down=\"{{ onTajniKey }}\" placeholder=\"Dodaj reč pa Enter…\" style=\"font:inherit;flex:1;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.2);border-radius:11px;padding:.55rem .75rem;font-size:.95rem\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\">\n            <button sc-camel-on-click=\"{{ addTajni }}\" style=\"font:inherit;cursor:pointer;border:none;background:linear-gradient(120deg,#1D3557,#162E4E);color:#F5EBE0;font-weight:700;padding:.55rem 1.1rem;border-radius:11px\">Dodaj<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:.5rem\">\n            <sc-for list=\"{{ tajniWords }}\" as=\"w\" hint-placeholder-count=\"20\">\n              <span style=\"display:inline-flex;align-items:center;gap:.45rem;background:#EDE3D7;border:1px solid rgba(29,53,87,.12);color:#1D3557;font-weight:700;font-size:.9rem;padding:.35rem .4rem .35rem .8rem;border-radius:20px\">{{ w.text }}<button sc-camel-on-click=\"{{ w.onRemove }}\" style=\"font:inherit;cursor:pointer;border:none;background:rgba(176,74,66,.12);color:#B04A42;width:22px;height:22px;border-radius:50%;font-size:.75rem;line-height:1\">✕<\u002Fbutton><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== GLUVO DOBA (roles) ===== -->\n    <sc-if value=\"{{ showGluvo }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .2s ease;max-width:860px\">\n        <div style=\"display:flex;align-items:center;gap:1rem;background:#FAF6F0;border:1px solid rgba(29,53,87,.12);border-radius:14px;padding:.9rem 1.1rem;margin-bottom:1rem\">\n          <div style=\"flex:1\"><div style=\"font-weight:800;color:#1D3557\">Broj vukova<\u002Fdiv><div style=\"font-size:.8rem;color:#6E6A5E\">Koliko igrača su vukovi u ovom packu<\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ wolvesDown }}\" style=\"font:inherit;cursor:pointer;border:1.5px solid rgba(29,53,87,.26);background:#FFFCF7;width:38px;height:38px;border-radius:10px;font-size:1.1rem;font-weight:800;color:#1D3557\">−<\u002Fbutton>\n          <span style=\"font-family:'Fredoka';font-size:1.5rem;font-weight:700;color:#1D3557;min-width:2ch;text-align:center\">{{ wolves }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ wolvesUp }}\" style=\"font:inherit;cursor:pointer;border:1.5px solid rgba(29,53,87,.26);background:#FFFCF7;width:38px;height:38px;border-radius:10px;font-size:1.1rem;font-weight:800;color:#1D3557\">＋<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-weight:800;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#A07D2E;margin-bottom:.6rem\">Uloge u packu · {{ rolesOnCount }} uključeno<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem\">\n          <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <button sc-camel-on-click=\"{{ r.onToggle }}\" style=\"font:inherit;cursor:pointer;display:flex;align-items:center;gap:.65rem;text-align:left;background:{{ r.bg }};border:1.5px solid {{ r.border }};border-radius:13px;padding:.7rem .85rem\">\n              <span style=\"font-size:1.5rem;flex:none\">{{ r.icon }}<\u002Fspan>\n              <span style=\"flex:1\"><span style=\"display:block;font-weight:800;color:{{ r.nameColor }}\">{{ r.label }}<\u002Fspan><span style=\"display:block;font-size:.74rem;color:#6E6A5E\">{{ r.stateLabel }}<\u002Fspan><\u002Fspan>\n              <span style=\"width:38px;height:22px;border-radius:20px;background:{{ r.track }};position:relative;flex:none\"><span style=\"position:absolute;top:2px;left:{{ r.knob }};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s\"><\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== EMOJI (puzzles) ===== -->\n    <sc-if value=\"{{ showEmoji }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn .2s ease;max-width:860px\">\n        <div style=\"display:flex;gap:.5rem;flex-wrap:wrap;background:#FAF6F0;border:1px solid rgba(29,53,87,.12);border-radius:14px;padding:.8rem;margin-bottom:1rem\">\n          <input value=\"{{ emojiEmojis }}\" sc-camel-on-input=\"{{ onEmojiEmojis }}\" placeholder=\"Emoji 🦁👑\" style=\"font:inherit;width:150px;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.2);border-radius:11px;padding:.55rem .75rem;font-size:1.1rem\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\">\n          <input value=\"{{ emojiAnswer }}\" sc-camel-on-input=\"{{ onEmojiAnswer }}\" sc-camel-on-key-down=\"{{ onEmojiKey }}\" placeholder=\"Rešenje…\" style=\"font:inherit;flex:1;min-width:140px;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.2);border-radius:11px;padding:.55rem .75rem;font-size:.95rem\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\">\n          <button sc-camel-on-click=\"{{ addEmoji }}\" style=\"font:inherit;cursor:pointer;border:none;background:linear-gradient(120deg,#1D3557,#162E4E);color:#F5EBE0;font-weight:700;padding:.55rem 1.2rem;border-radius:11px\">＋ Dodaj<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem\">\n          <sc-for list=\"{{ emojiPuzzles }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"background:#FAF6F0;border:1px solid rgba(29,53,87,.12);border-radius:14px;padding:.9rem 1rem;display:flex;align-items:center;gap:.7rem\" style-hover=\"box-shadow:0 8px 22px rgba(29,53,87,.1)\">\n              <span style=\"font-size:1.8rem;flex:none\">{{ p.emojis }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0\"><span style=\"display:block;font-size:.66rem;color:#9B9488;font-weight:700;text-transform:uppercase;letter-spacing:.06em\">Rešenje<\u002Fspan><span style=\"display:block;font-weight:800;color:#1D3557;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.answer }}<\u002Fspan><\u002Fspan>\n              <button sc-camel-on-click=\"{{ p.onDel }}\" style=\"font:inherit;cursor:pointer;border:1px solid rgba(176,74,66,.35);background:rgba(176,74,66,.08);width:30px;height:30px;border-radius:8px;font-size:.8rem;color:#B04A42;flex:none\">🗑<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== SPIJUN (locations + roles) === eholder=\"Jedan po redu — za automatsko priznavanje\" style=\"font:inherit;width:100%;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.26);border-radius:11px;padding:.6rem .75rem;font-size:.92rem;resize:vertical\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\"><\u002Ftextarea>\n          <p style=\"color:#9B9488;font-size:.75rem;margin-top:.4rem\">Slobodan unos — igrači kucaju odgovor, host ocenjuje ako nije na listi.<\u002Fp>\n        <\u002Fsc-if>\n        <!-- ko-sam-ja: peer -->\n        <sc-if value=\"{{ sf.koPeer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:rgba(184,92,79,.08);border:1px solid rgba(184,92,79,.28);border-radius:12px;padding:.8rem 1rem;margin-top:1rem;color:#8a463c;font-size:.86rem\">👥 Pitanje o igraču — odgovor je ime jednog od prisutnih igrača. Nema unapred zadatog rešenja.<\u002Fdiv>\n        <\u002Fsc-if>\n        <!-- ko-sam-ja: pickN -->\n        <sc-if value=\"{{ sf.koPick }}\" hint-placeholder-val=\"{{ false }}\">\n          <label style=\"display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#A07D2E;margin:1rem 0 .35rem\">Broj tačnih (N) <input type=\"number\" value=\"2\" style=\"font:inherit;width:60px;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.26);border-radius:8px;padding:.25rem .4rem;text-transform:none\"><\u002Flabel>\n          <label style=\"display:block;font-weight:800;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#A07D2E;margin:1rem 0 .35rem\">Opcije · označi tačne<\u002Flabel>\n          <sc-for list=\"{{ optRows }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem\">\n              <input type=\"checkbox\" checked=\"{{ o.checked }}\" style=\"width:20px;height:20px;accent-color:#A07D2E;flex:none;cursor:pointer\">\n              <input placeholder=\"{{ o.ph }}\" style=\"font:inherit;flex:1;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.26);border-radius:10px;padding:.5rem .7rem;font-size:.92rem\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <!-- image (kviz non-video) -->\n        <sc-if value=\"{{ sf.image }}\" hint-placeholder-val=\"{{ false }}\">\n          <label style=\"display:block;font-weight:800;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#A07D2E;margin:1rem 0 .35rem\">{{ imageLabel }}<\u002Flabel>\n          <div style=\"border:1.5px dashed rgba(29,53,87,.28);border-radius:12px;padding:1.1rem;text-align:center;background:#FFFCF7\"><div style=\"font-size:1.6rem\">🖼<\u002Fdiv><div style=\"font-size:.85rem;color:#6E6A5E;margin-top:.3rem\">Prevuci sliku ili<\u002Fdiv><button style=\"font:inherit;cursor:pointer;margin-top:.5rem;border:1.5px solid rgba(29,53,87,.26);background:transparent;color:#1D3557;font-weight:700;font-size:.85rem;padding:.4rem .9rem;border-radius:10px\">Izaberi sliku<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <label style=\"display:block;font-weight:800;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#A07D2E;margin:1rem 0 .35rem\">Vreme (s) · opciono<\u002Flabel>\n        <input type=\"number\" placeholder=\"15\" style=\"font:inherit;width:130px;background:#FFFCF7;border:1.5px solid rgba(29,53,87,.26);border-radius:11px;padding:.5rem .7rem;font-size:.92rem\" style-focus=\"outline:none;border-color:#C29B47;box-shadow:0 0 0 3px rgba(194,155,71,.2)\">\n      <\u002Fdiv>\n\n      <div style=\"padding:1rem 1.3rem;border-top:1px solid rgba(29,53,87,.12);background:#FAF6F0;display:flex;gap:.6rem;align-items:center\">\n        <button sc-camel-on-click=\"{{ closeSheet }}\" style=\"font:inherit;cursor:pointer;border:1.5px solid rgba(29,53,87,.26);background:transparent;color:#1D3557;font-weight:700;font-size:.9rem;padding:.6rem 1rem;border-radius:12px\">Otkaži<\u002Fbutton>\n        <span style=\"flex:1\"><\u002Fspan>\n        <sc-if value=\"{{ isNew }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ saveAgain }}\" style=\"font:inherit;cursor:pointer;border:1.5px solid #C29B47;background:rgba(194,155,71,.14);color:#8a6f2c;font-weight:800;font-size:.9rem;padding:.6rem 1rem;border-radius:12px\">Sačuvaj i dodaj još<\u002Fbutton>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ closeSheet }}\" style=\"font:inherit;cursor:pointer;border:none;background:linear-gradient(120deg,#1D3557,#162E4E);color:#F5EBE0;font-weight:800;font-size:.92rem;padding:.6rem 1.3rem;border-radius:12px;box-shadow:0 8px 20px rgba(29,53,87,.24)\">Sačuvaj<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C29B47&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#C29B47&quot;,&quot;#B85C4F&quot;,&quot;#3E7F7B&quot;,&quot;#5C6FA6&quot;],&quot;section&quot;:&quot;Izgled&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Ugodno&quot;,&quot;options&quot;:[&quot;Ugodno&quot;,&quot;Kompaktno&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Izgled&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    game: 'kviz',\n    filter: 'all',\n    search: '',\n    sheet: false,\n    sheetType: 'obicno',\n    editIdx: null,\n    pickerOpen: false,\n    pack: { kviz:'pop-kultura', 'ko-sam-ja':'sample-mix', 'tajni-agenti':'standardni', 'gluvo-doba':'pun-haos', 'emoji':'filmovi', 'spijun':'standardne' },\n    tajniInput: '',\n    emojiEmojis: '', emojiAnswer: '',\n    locInput: '',\n    dragIdx: null,\n    wolves: 3,\n    rolesOn: ['vidovnjak','lekar','lovac','vestica','zmaj','ludak','spijun','devojcica','telohranitelj'],\n    q: {\n      kviz: [\n        { type:'obicno', text:'Koja planeta je najbliža Suncu?', options:['Merkur','Venera','Mars','Zemlja'], correctIndex:0, timeLimit:15 },\n        { type:'obicno', text:'Ko je napisao roman „Na Drini ćuprija\"?', options:['Ivo Andrić','Miloš Crnjanski','Meša Selimović'], correctIndex:0, timeLimit:20 },\n        { type:'audio', text:'Koja pesma trenutno svira?', options:['Riblja čorba','Bijelo dugme','EKV'], correctIndex:2, timeLimit:15, media:true },\n        { type:'video', text:'Iz kog je filma ova scena?', options:['Ko to tamo peva','Maratonci','Balkanski špijun'], correctIndex:0, timeLimit:20, media:true },\n        { type:'geo', text:'Gde je snimljena ova fotografija?', caption:'Đavolja varoš', lat:44.4405, lng:21.6621, timeLimit:30, media:true },\n        { type:'broj', text:'Kolika je visina Ajfelove kule?', answer:330, min:100, max:600, unit:'m', timeLimit:25 },\n        { type:'broj', text:'Koje godine je pao Carigrad?', answer:1453, min:1300, max:1600, unit:'god.', timeLimit:25 },\n        { type:'obicno', text:'Koja je najviša planina u Srbiji?', options:['Midžor','Kopaonik','Rtanj','Tara'], correctIndex:0, timeLimit:15 },\n      ],\n      'ko-sam-ja': [\n        { type:'fixed', text:'Ko drži rekord po broju Grend slem titula?', answer:'Novak Đoković', timeLimit:30 },\n        { type:'free', text:'Napiši ime poznatog srpskog naučnika.', timeLimit:30 },\n        { type:'peer', text:'Ko će pre zaspati na žurci?', timeLimit:25 },\n        { type:'pickN', text:'Izaberi 2 grada koja su bila prestonice Srbije.', options:['Beograd','Kragujevac','Niš','Novi Sad'], pick:2, timeLimit:35 },\n        { type:'fixed', text:'Koja životinja je simbol Žabara?', answer:'Žaba', timeLimit:20 },\n        { type:'free', text:'Napiši jedan film Emira Kusturice.', timeLimit:30 },\n      ],\n    },\n    tajniWords: ['Aerodrom','Bolnica','Škola','Plaža','Svemirska stanica','Podmornica','Cirkus','Kazino','Muzej','Restoran','Banka','Pozorište','Univerzitet','Hotel','Voz','Piramida','Zoološki vrt','Bioskop','Pijaca','Stadion','Crkva','Vojna baza'],\n    emojiPuzzles: [ {emojis:'🦁👑',answer:'Kralj lavova'}, {emojis:'🕷️🕸️🧑',answer:'Spajdermen'}, {emojis:'🚢🧊💔',answer:'Titanik'}, {emojis:'🤖🚗',answer:'Transformersi'}, {emojis:'👻🚫',answer:'Istrebljivači duhova'}, {emojis:'🧙‍♂️💍🌋',answer:'Gospodar prstenova'} ],\n    spijunLoc: [\n      { name:'Aerodrom', roles:['Pilot','Stjuardesa','Putnik','Carinik','Mehaničar'] },\n      { name:'Bolnica', roles:['Hirurg','Sestra','Pacijent','Anesteziolog'] },\n      { name:'Podmornica', roles:['Kapetan','Mornar','Kuvar','Radista'] },\n      { name:'Kazino', roles:['Diler','Kockar','Zaštitar','Konobar'] },\n    ],\n  };\n\n  KVIZ_TYPE = {\n    obicno: { icon:'❓', label:'Obično', color:'#5C6FA6', bg:'rgba(92,111,166,.13)' },\n    audio:  { icon:'🎵', label:'Audio',  color:'#3E7F7B', bg:'rgba(62,127,123,.13)' },\n    video:  { icon:'🎬', label:'Video',  color:'#B85C4F', bg:'rgba(184,92,79,.13)' },\n    geo:    { icon:'🗺️', label:'Geo',    color:'#3E7D57', bg:'rgba(62,125,87,.13)' },\n    broj:   { icon:'🔢', label:'Broj',   color:'#A07D2E', bg:'rgba(160,125,46,.14)' },\n  };\n  KO_TYPE = {\n    fixed: { icon:'📌', label:'Fiksno',    color:'#5C6FA6', bg:'rgba(92,111,166,.13)' },\n    free:  { icon:'✍️', label:'Slobodno',  color:'#3E7F7B', bg:'rgba(62,127,123,.13)' },\n    peer:  { icon:'👥', label:'Igrač',     color:'#B85C4F', bg:'rgba(184,92,79,.13)' },\n    pickN: { icon:'☑️', label:'Izaberi N', color:'#A07D2E', bg:'rgba(160,125,46,.14)' },\n  };\n  GAMES = [\n    { id:'kviz', label:'Kviz', icon:'❓', count:13 },\n    { id:'ko-sam-ja', label:'Ko sam ja', icon:'🧠', count:2 },\n    { id:'tajni-agenti', label:'Tajni agenti', icon:'🕵️', count:1 },\n    { id:'gluvo-doba', label:'Gluvo doba', icon:'🌙', count:3 },\n    { id:'emoji', label:'Emoji', icon:'😀', count:1 },\n    { id:'spijun', label:'Špijun', icon:'🔍', count:2 },\n    { id:'timinzi', label:'Timinzi', icon:'⏱️', count:0 },\n  ];\n  PACKS = {\n    kviz: [ ['pop-kultura','Pop kultura','🎬',8,true], ['istorija','Istorija Srbije','🏛️',30,true], ['gejming','Gejming','🎮',22,true], ['draft','Nova (draft)','✏️',0,false] ],\n    'ko-sam-ja': [ ['sample-mix','Sample mix','🧠',6,true], ['lako','Lako za početak','🌤️',12,true] ],\n    'tajni-agenti': [ ['standardni','Standardni','🕵️',22,false], ['filmovi','Filmovi','🎬',30,true] ],\n    'gluvo-doba': [ ['pun-haos','Pun haos','🎭',9,true], ['4-1-1','4 na 1','🐺',6,true], ['samo-osnovno','Samo osnovno','🌙',3,true] ],\n    'emoji': [ ['filmovi','Filmovi i crtani','🎬',6,true] ],\n    'spijun': [ ['standardne','Standardne lokacije','🔍',4,true], ['zabari','Žabari','🐸',8,true] ],\n  };\n  ROLES = [ ['vidovnjak','Vidovnjak','🔮'], ['lekar','Lekar','💉'], ['lovac','Lovac','🎯'], ['vestica','Veštica','🧪'], ['telohranitelj','Telohranitelj','🛡️'], ['devojcica','Devojčica','👧'], ['ludak','Ludak','🃏'], ['zmaj','Zmaj','🐉'], ['spijun','Špijun','🕵️'], ['starac','Starešina','🧓'] ];\n\n  set(patch){ this.setState(patch); }\n\n  answerLine(q, game){\n    if (game === 'kviz'){\n      if (q.type==='geo') return '📍 ' + (q.caption||'—') + ' · ' + q.lat.toFixed(3) + ', ' + q.lng.toFixed(3);\n      if (q.type==='broj') return '✔ ' + q.answer + (q.unit?(' '+q.unit):'') + ' · opseg ' + q.min + '–' + q.max;\n      return (q.options||[]).map((o,i)=> i===q.correctIndex?('✓ '+o):o).join('  ·  ');\n    }\n    if (q.type==='fixed') return '✔ ' + (q.answer||'—');\n    if (q.type==='free') return 'Slobodan unos — igrači kucaju odgovor';\n    if (q.type==='peer') return 'Odgovor je ime prisutnog igrača';\n    if (q.type==='pickN') return 'Izaberi ' + (q.pick||2) + ' · ' + (q.options||[]).join(', ');\n    return '';\n  }\n  mediaTag(t){ return t==='audio'?'audio':t==='video'?'video':'slika'; }\n\n  renderVals(){\n    const { game, filter, search, sheet, sheetType, editIdx, pickerOpen } = this.state;\n    const accent = this.props.accent ?? '#C29B47';\n    const compact = (this.props.density ?? 'Ugodno') === 'Kompaktno';\n    const rowPad = compact ? '.55rem' : '.8rem';\n    const isTable = game==='kviz' || game==='ko-sam-ja';\n    const TM = game==='ko-sam-ja' ? this.KO_TYPE : this.KVIZ_TYPE;\n\n    const games = this.GAMES.map(g => {\n      const active = g.id === game;\n      return { ...g,\n        onClick: (e)=>{ e.preventDefault(); this.set({ game:g.id, sheet:false, filter:'all', search:'', pickerOpen:false, sheetType: g.id==='ko-sam-ja'?'fixed':'obicno' }); },\n        fg: active ? '#FFFDF9' : 'rgba(245,235,224,.82)',\n        bg: active ? 'rgba(194,155,71,.20)' : 'transparent',\n        bar: active ? accent : 'transparent',\n        pillBg: active ? accent : 'rgba(245,235,224,.13)',\n        pillFg: active ? '#22303f' : 'rgba(245,235,224,.7)',\n      };\n    });\n\n    // pack picker\n    const hasPicker = game !== 'timinzi';\n    const packList = this.PACKS[game] || [];\n    const curId = this.state.pack[game];\n    const curRaw = packList.find(p=>p[0]===curId) || packList[0] || ['','—','📦',0,false];\n    const metaOf = (n)=> game==='tajni-agenti' ? (n+' reči') : game==='spijun' ? (n+' lokacija') : game==='emoji' ? (n+' zagonetki') : game==='gluvo-doba' ? (n+' uloga') : (n+' pitanja');\n    const curPack = { icon:curRaw[2], name:curRaw[1], meta:metaOf(curRaw[3]),\n      badge: curRaw[4]?'Vidljiv u igri':'Nevidljiv (draft)', badgeBg:curRaw[4]?'rgba(62,125,87,.14)':'rgba(160,125,46,.16)', badgeFg:curRaw[4]?'#3E7D57':'#A07D2E' };\n    const packOptions = packList.map(p=>({ icon:p[2], name:p[1], meta:metaOf(p[3]),\n      dot:p[4]?'#3E7D57':'#A07D2E', rowBg: p[0]===curId?'rgba(194,155,71,.14)':'transparent',\n      onSelect: ()=> this.set({ pack:{...this.state.pack, [game]:p[0]}, pickerOpen:false, search:'', filter:'all' }) }));\n\n    // table rows (kviz + ko)\n    const list = this.state.q[game] || [];\n    const s = search.trim().toLowerCase();\n    const rows = list.map((q,idx)=>({q,idx})).filter(({q})=> (filter==='all'||q.type===filter) && (!s || (q.text||'').toLowerCase().includes(s) || (q.caption||'').toLowerCase().includes(s)))\n      .map(({q,idx})=>{ const m=TM[q.type]||{icon:'•',label:q.type,color:'#6E6A5E',bg:'#eee'}; return {\n        num:(idx+1)+'.', text:q.text||(q.type==='geo'?'Gde je ovo slikano?':'(bez teksta)'),\n        tIcon:m.icon, tLabel:m.label, tColor:m.color, tBg:m.bg,\n        hasMedia:!!q.media, mediaTag:this.mediaTag(q.type), answerLine:this.answerLine(q,game),\n        timeLabel:(q.timeLimit||15)+'s',\n        onEdit:()=>this.openEdit(idx), onDup:()=>this.dup(idx), onDel:()=>this.del(idx),\n        onDragStart:()=>this.set({dragIdx:idx}), onDrop:(e)=>{e.preventDefault();this.drop(idx);},\n      }; });\n    const counts = { all: list.length };\n    for (const k in TM) counts[k] = list.filter(x=>x.type===k).length;\n    const filters = [['all','Sve']].concat(Object.keys(TM).map(k=>[k,TM[k].icon+' '+TM[k].label])).map(([k,label])=>{\n      const on=filter===k; return { label, count:counts[k]||0, onClick:()=>this.set({filter:k}),\n        bg:on?'#1D3557':'#FAF6F0', fg:on?'#F5EBE0':'#1D3557', border:on?'#1D3557':'rgba(29,53,87,.2)' };\n    });\n\n    // sheet\n    const isKviz = game==='kviz';\n    const isChoice = isKviz && (sheetType==='obicno'||sheetType==='audio'||sheetType==='video');\n    const sf = {\n      choice: isChoice, audio: isKviz&&sheetType==='audio', video: isKviz&&sheetType==='video',\n      broj: isKviz&&sheetType==='broj', geo: isKviz&&sheetType==='geo', image: isKviz&&sheetType!=='video',\n      koFixed: !isKviz&&sheetType==='fixed', koFree: !isKviz&&sheetType==='free',\n      koPeer: !isKviz&&sheetType==='peer', koPick: !isKviz&&sheetType==='pickN',\n    };\n    const typeTabs = Object.keys(TM).map(k=>{ const on=sheetType===k; return { icon:TM[k].icon, label:TM[k].label,\n      onClick:()=>this.set({sheetType:k}), bg:on?TM[k].color:'#FFFCF7', fg:on?'#fff':'#6E6A5E', border:on?TM[k].color:'rgba(29,53,87,.16)' }; });\n    const optRows = [0,1,2,3].map(i=>({ checked:i===0, ph:'Odgovor '+(i+1)+(i>1?' (opciono)':'') }));\n\n    // gluvo roles\n    const rolesOnSet = this.state.rolesOn;\n    const roles = this.ROLES.map(([id,label,icon])=>{ const on=rolesOnSet.includes(id); return { icon, label,\n      onToggle:()=> this.set({ rolesOn: on ? rolesOnSet.filter(x=>x!==id) : [...rolesOnSet,id] }),\n      bg:on?'rgba(194,155,71,.12)':'#FAF6F0', border:on?'#C29B47':'rgba(29,53,87,.14)', nameColor:on?'#1D3557':'#6E6A5E',\n      stateLabel:on?'Uključena':'Isključena', track:on?'#3E7D57':'#C7BDB0', knob:on?'18px':'2px' }; });\n\n    // emoji\n    const emojiPuzzles = this.state.emojiPuzzles.map((p,i)=>({ emojis:p.emojis, answer:p.answer, onDel:()=> this.set({ emojiPuzzles:this.state.emojiPuzzles.filter((_,j)=>j!==i) }) }));\n\n    // spijun\n    const spijunLoc = this.state.spijunLoc.map((l,li)=>({ name:l.name, roleCount:l.roles.length,\n      onDel:()=> this.set({ spijunLoc:this.state.spijunLoc.filter((_,j)=>j!==li) }),\n      onAddRole:(e)=>{ if(e.key!=='Enter')return; const v=e.target.value.trim(); if(!v)return; e.target.value=''; const loc=this.state.spijunLoc.slice(); if(loc[li].roles.some(r=>r.toLowerCase()===v.toLowerCase()))return; loc[li]={...loc[li],roles:[...loc[li].roles,v]}; this.set({spijunLoc:loc}); },\n      roles:l.roles.map((r,ri)=>({ text:r, onRemove:()=>{ const loc=this.state.spijunLoc.slice(); loc[li]={...loc[li],roles:loc[li].roles.filter((_,j)=>j!==ri)}; this.set({spijunLoc:loc}); } })) }));\n\n    // tajni\n    const tajniWords = this.state.tajniWords.map((w,i)=>({ text:w, onRemove:()=> this.set({ tajniWords:this.state.tajniWords.filter((_,j)=>j!==i) }) }));\n\n    // timinzi\n    const timinzi = [\n      { icon:'❓', game:'Kviz', fields:[['Vreme po pitanju',15],['Prikaz rezultata',6]] },\n      { icon:'🧠', game:'Ko sam ja', fields:[['Vreme po pojmu',30]] },\n      { icon:'🕵️', game:'Tajni agenti', fields:[['Diskusija',120],['Glasanje',30]] },\n      { icon:'🌙', game:'Gluvo doba', fields:[['Noć',40],['Dan / diskusija',120]] },\n      { icon:'😀', game:'Emoji', fields:[['Vreme po zagonetki',25]] },\n      { icon:'🔍', game:'Špijun', fields:[['Trajanje runde (s)',480]] },\n    ].map(t=>({ icon:t.icon, game:t.game, fields:t.fields.map(([label,value])=>({label,value:String(value)})) }));\n\n    return {\n      games, gameLabel: (this.GAMES.find(g=>g.id===game)||{}).label, rowPad,\n      hasPicker, pickerOpen, curPack, packOptions, togglePicker:()=>this.set({pickerOpen:!pickerOpen}),\n      showTable:isTable, rows, filters, search, onSearch:(e)=>this.set({search:e.target.value}),\n      noResults: isTable && rows.length===0,\n      showTajni: game==='tajni-agenti', showGluvo: game==='gluvo-doba', showEmoji: game==='emoji',\n      showSpijun: game==='spijun', showTiminzi: game==='timinzi',\n      // gluvo\n      wolves:this.state.wolves, wolvesUp:()=>this.set({wolves:Math.min(6,this.state.wolves+1)}), wolvesDown:()=>this.set({wolves:Math.max(1,this.state.wolves-1)}),\n      roles, rolesOnCount: rolesOnSet.length,\n      // emoji\n      emojiPuzzles, emojiEmojis:this.state.emojiEmojis, emojiAnswer:this.state.emojiAnswer,\n      onEmojiEmojis:(e)=>this.set({emojiEmojis:e.target.value}), onEmojiAnswer:(e)=>this.set({emojiAnswer:e.target.value}),\n      onEmojiKey:(e)=>{ if(e.key==='Enter') this.addEmoji(); }, addEmoji:()=>this.addEmoji(),\n      // spijun\n      spijunLoc, locInput:this.state.locInput, onLocInput:(e)=>this.set({locInput:e.target.value}),\n      onLocKey:(e)=>{ if(e.key==='Enter') this.addLoc(); }, addLoc:()=>this.addLoc(),\n      // tajni\n      tajniWords, tajniInput:this.state.tajniInput, onTajniInput:(e)=>this.set({tajniInput:e.target.value}),\n      onTajniKey:(e)=>{ if(e.key==='Enter') this.addTajni(); }, addTajni:()=>this.addTajni(),\n      // timinzi\n      timinzi,\n      // sheet\n      sheet, sf, typeTabs, optRows, isNew: editIdx===null,\n      sheetEyebrow: editIdx===null?'Novo pitanje':'Izmena pitanja',\n      sheetTitle: (TM[sheetType]?.icon||'')+' '+(TM[sheetType]?.label||'')+' pitanje',\n      textLabel: sheetType==='geo'?'Tekst (opciono — „Gde je ovo slikano?\")':'Tekst pitanja',\n      textPh: sheetType==='peer'?'npr. Ko će pre zaspati na žurci?':'npr. Koja planeta je najbliža Suncu?',\n      imageLabel: sheetType==='geo'?'Slika (obavezno — to je pitanje)':'Slika (opciono)',\n      openNew:()=>this.set({sheet:true, editIdx:null, sheetType: game==='ko-sam-ja'?'fixed':'obicno'}),\n      closeSheet:()=>this.set({sheet:false}), saveAgain:()=>this.set({sheetType:this.state.sheetType}),\n      dragOver:(e)=>e.preventDefault(), noop:()=>{},\n    };\n  }\n\n  openEdit(idx){ const q=this.state.q[this.state.game][idx]; this.set({sheet:true, editIdx:idx, sheetType:q.type}); }\n  dup(idx){ const g=this.state.game; const arr=this.state.q[g].slice(); arr.splice(idx+1,0,{...arr[idx]}); this.set({q:{...this.state.q,[g]:arr}}); }\n  del(idx){ const g=this.state.game; this.set({q:{...this.state.q,[g]:this.state.q[g].filter((_,i)=>i!==idx)}}); }\n  drop(target){ const from=this.state.dragIdx; if(from==null||from===target)return; const g=this.state.game; const arr=this.state.q[g].slice(); const [m]=arr.splice(from,1); arr.splice(target,0,m); this.set({q:{...this.state.q,[g]:arr}, dragIdx:null}); }\n  addTajni(){ const v=this.state.tajniInput.trim(); if(!v)return; if(this.state.tajniWords.some(w=>w.toLowerCase()===v.toLowerCase())){ this.set({tajniInput:''}); return; } this.set({tajniWords:[...this.state.tajniWords,v], tajniInput:''}); }\n  addEmoji(){ const e=this.state.emojiEmojis.trim(), a=this.state.emojiAnswer.trim(); if(!e||!a)return; this.set({emojiPuzzles:[...this.state.emojiPuzzles,{emojis:e,answer:a}], emojiEmojis:'', emojiAnswer:''}); }\n  addLoc(){ const v=this.state.locInput.trim(); if(!v)return; this.set({spijunLoc:[...this.state.spijunLoc,{name:v,roles:[]}], locInput:''}); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
